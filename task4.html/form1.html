<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form and control tag</title>
</head>
<body>
    <form name="form1" action="serverpg1" method="post">
        <table align="center" bgcolor="silver" cellspacing="1px">
            <tr><td colspan="2" align="center">
             <h1>HTML FORM</h1></td></tr>
            <tr>
                <td>
                <label for="1">First Name:</label>
                </td>
                <td>
                <input type="text" id="1" name="name1" required >
                </td>
            </tr>
            <tr>
                <td>
                <label for="2">Last Name:</label>
                </td>
                <td>
                    <input type="text" id="2" name="name2" required>
                </td>
            </tr>
            <tr>
                <td>
                <label for="3">Date of Birth:</label>
                </td>
                <td>
                <input type="date" id="3" name="name3" required>
                </td>
            </tr>
                <tr>
                    <td>
                    <label for="4">Mobile Number:</label>
                    </td>

                    <td>
                    <input type="number" required>
                </td>

            </tr>
            <tr>
                <td colspan="2">
                    <label for="7">subject:</label>
                 <br>
                </td>
            </tr>
            <tr>
                <td colspan="2" >
                    <select name="subject" id="7" style="width: 100%" required>
                        <option value="choose an option">choose an option</option>
                        <option value="telugu">telugu</option>
                        <option value="hindi">hindi</option>
                        <option value="english">english</option>
                        <option value="maths">maths</option>
                        <option value="others">others</option>

                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" required>
               
                    <input type="reset">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
